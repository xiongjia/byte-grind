services:
  # Redash frontend + API server
  server:
    image: redash/redash:26.3.0
    depends_on:
      redash-pg:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    ports:
      - "5501:5000"
    container_name: redash-server
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_DATABASE_URL: postgres://redash:redash@redash-pg:5432/redash
      REDASH_COOKIE_SECRET: localdevsecret
      REDASH_CELERY_WORKERS_COUNT: 1
      REDASH_CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      REDASH_ADHOC_QUERY_TIME_LIMIT: 30
    volumes:
      - redash_init:/redash-init
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -f /redash-init/.initialized ]; then
          /app/bin/docker-entrypoint create_db
          touch /redash-init/.initialized
        fi
        exec /app/bin/docker-entrypoint server

  # Redash background RQ worker: runs queries and scheduled jobs
  worker:
    image: redash/redash:26.3.0
    container_name: redash-worker
    depends_on:
      redash-pg:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_DATABASE_URL: postgres://redash:redash@redash-pg:5432/redash
      REDASH_COOKIE_SECRET: localdevsecret
      REDASH_CELERY_WORKERS_COUNT: 1
      REDASH_CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      REDASH_ADHOC_QUERY_TIME_LIMIT: 30
    command: worker

  # PostgreSQL 18: hosts both redash db and scratch_db for local data imports
  redash-pg:
    image: postgres:18-alpine
    container_name: redash-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash -d redash"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=redash
      - POSTGRES_PASSWORD=redash
      - POSTGRES_DB=redash
      - SCRATCH_DB_USER=localdev
      - SCRATCH_DB_PASSWORD=localdev123
      - SCRATCH_DB_NAME=scratch_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "6433:5432"
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        sed -i "s|^#listen_addresses.*|listen_addresses = '*'|" /usr/local/share/postgresql.conf
        sed -i "s|^listen_addresses.*|listen_addresses = '*'|" /usr/local/share/postgresql.conf
        echo "host all all 0.0.0.0/0 md5" >> /usr/local/share/pg_hba.conf
        echo "host all all ::0/0 md5" >> /usr/local/share/pg_hba.conf
        docker-entrypoint.sh postgres \
          -c shared_buffers=128MB \
          -c work_mem=64MB \
          -c maintenance_work_mem=64MB \
          -c effective_cache_size=256MB \
          -c max_connections=100 &
        for i in {1..30}; do
          pg_isready -U $${POSTGRES_USER} && break
          sleep 1
        done
        if ! psql -Atc "SELECT 1 FROM pg_roles WHERE rolname='$${SCRATCH_DB_USER}'" -U $${POSTGRES_USER}; then
          psql -U $${POSTGRES_USER} -c "CREATE USER $${SCRATCH_DB_USER} WITH PASSWORD '$${SCRATCH_DB_PASSWORD}';"
        fi
        if ! psql -Atc "SELECT 1 FROM pg_database WHERE datname='$${SCRATCH_DB_NAME}'" -U $${POSTGRES_USER}; then
          psql -U $${POSTGRES_USER} -c "CREATE DATABASE $${SCRATCH_DB_NAME} OWNER $${SCRATCH_DB_USER};"
        fi
        wait

  # Redis 8: used by Redash for caching and RQ job queue
  redash-redis:
    image: redis:8-alpine
    container_name: redash-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6479:6379"

volumes:
  redash_init:
  pg-data: